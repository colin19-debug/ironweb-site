# Only /site is published. src/, scripts/, docs/, brand_assets/ and screenshots stay private.
# There is no build command: the HTML in /site is generated locally (node scripts/build.mjs) and committed.
[build]
  publish = "site"
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---- Old routes (previous site and pre-v3 pages). force = true so stale copies never serve. ----
[[redirects]]
  from = "/services"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/services/*"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/automations/bundles/*"
  to = "/operate/"
  status = 301
  force = true
[[redirects]]
  from = "/automations/*"
  to = "/operate/"
  status = 301
  force = true
[[redirects]]
  from = "/automations"
  to = "/operate/"
  status = 301
  force = true
[[redirects]]
  from = "/growth/*"
  to = "/grow/"
  status = 301
  force = true
[[redirects]]
  from = "/growth"
  to = "/grow/"
  status = 301
  force = true
[[redirects]]
  from = "/contractor-demo/*"
  to = "/demo/"
  status = 301
  force = true
[[redirects]]
  from = "/contractor-demo"
  to = "/demo/"
  status = 301
  force = true
[[redirects]]
  from = "/pricing"
  to = "/"
  status = 301
[[redirects]]
  from = "/pricing/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/work"
  to = "/portfolio/"
  status = 301
[[redirects]]
  from = "/work/*"
  to = "/portfolio/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-src 'self' https://api.leadconnectorhq.com; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
