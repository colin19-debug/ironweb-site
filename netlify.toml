# Only /site is published. src/, scripts/, docs/, brand_assets/ and screenshots stay private.
# There is no build command: the HTML in /site is generated locally (node scripts/build.mjs) and committed.
[build]
  publish = "site"
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---- Old routes from the previous site ----
[[redirects]]
  from = "/services/*"
  to = "/services/"
  status = 301
[[redirects]]
  from = "/pricing"
  to = "/build/"
  status = 301
[[redirects]]
  from = "/pricing/*"
  to = "/build/"
  status = 301
[[redirects]]
  from = "/operate"
  to = "/automations/"
  status = 301
[[redirects]]
  from = "/operate/*"
  to = "/automations/"
  status = 301
[[redirects]]
  from = "/work"
  to = "/portfolio/"
  status = 301
[[redirects]]
  from = "/work/*"
  to = "/portfolio/"
  status = 301
[[redirects]]
  from = "/portfolio/*"
  to = "/portfolio/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
